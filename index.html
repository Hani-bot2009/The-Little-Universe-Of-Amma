<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Little Universe of Amma</title>
<style>

<div id="stage"><canvas id="c" width="800" height="480"></canvas></div>
<div id="ti"><canvas id="sk"></canvas><h1>THE LITTLE UNIVERSE OF AMMA</h1><div id="sc"><canvas id="oc" width="1040" height="1120"></canvas></div><p>Because somewhere in this universe lives someone who deserves all the magic in the world</p><em>Tap anywhere to continue</em></div>

<div id="tools" hidden><button id="bmap">Map</button><button id="bgoal">Goals</button><button id="inv" title="Collection">✿</button><button id="snd" title="Mute or unmute">♪</button><input id="vol" type="range" min="0" max="1" step=".05" title="Volume" aria-label="Volume"><button id="mnu" title="Menu">☰</button></div>

<script>
let $=s=>document.querySelector(s),W=800,H=480,cv=$('#c'),c=cv.getContext('2d'),K='amma-v1';
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}

const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const LOCS=[['garden','The Blooming Garden'],['home','The Cozy Little Home'],['forest','The Whispering Forest'],['hill','The Hill of a Thousand Stars']];
const st=id=>S.done.includes(id)?'Completed':S.loc===id?'Current':S.unl.includes(id)?'Unlocked':'Locked';

/* ---------- AUDIO (Web Audio synth: original, royalty-free, no files) ---------- */
let AC,mg,bus,mus,NB,shift=0,spb=.5,nextT=0,bar=0,stp=0;

function aInit(){if(AC){AC.resume&&AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=0;mg.connect(AC.destination);bus=AC.createGain();mus=AC.createGain();mus.connect(bus);bus.connect(mg);
const d=AC.createDelay();d.delayTime.value=.34;const fb=AC.createGain(),w=AC.createGain();fb.gain.value=.35;w.gain.value=.3;bus.connect(d);d.connect(fb);fb.connect(d);d.connect(w);w.connect(mg);

const a=AC.createBufferSource();a.buffer=NB;a.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=AC.createGain();g.gain.value=.012;a.connect(f);f.connect(g);g.connect(mg);a.start();
nextT=AC.currentTime+.3;setInterval(sched,120);vol()}catch(e){AC=null}}

function sched(){if(!AC||AC.state!=='running')return;while(nextT<AC.currentTime+.5){const b=bar%4,sh=shift;
if(stp===0||stp===4)CH[b].forEach((m,i)=>tone(m+sh,nextT+i*.04,{type:'triangle',v:.05,d:2.2,m:1}));
if(stp===0)tone(CH[b][0]-12+sh,nextT,{v:.06,d:2.5,m:1});
const m=ML[b][stp];if(m){tone(m+sh+12,nextT,{v:.035,d:1.1,m:1});tone(m+sh+24,nextT,{v:.008,d:.5,m:1})}
nextT+=spb;if(++stp>7){stp=0;bar++}}}
function setLoc(l){if(!AC)return;mus.gain.setTargetAtTime(0,AC.currentTime,.3);setTimeout(()=>{shift=l==='garden'?0:5;spb=l==='garden'?.5:.56;mus.gain.setTargetAtTime(1,AC.currentTime,.6)},1000)}
function chime(a,gap,v=.06){if(!AC)return;a.forEach((m,i)=>tone(m,AC.currentTime+i*gap,{v,d:1.6,type:i%2?'sine':'triangle'}))}
const SFX={step:()=>noise(AC.currentTime,.08,350,200,.025),spark:()=>chime([96+(R(0,4)|0),100],.07,.02),pick:()=>tone(79,AC.currentTime,{v:.05,d:.5}),
place:()=>chime([76,83],.09),oops:()=>tone(64,AC.currentTime,{v:.03,d:.6,type:'triangle'}),bloom:()=>chime([72,76,79,83,88],.13),
heart:()=>chime([67,72,76,79,84],.2),star:()=>chime([72,79,84,88,91],.15),ach:()=>chime([72,76,79,84,88,91,96],.17,.07),
fly:()=>{chime([88+(R(0,5)|0),93],.1,.015)},door:()=>{noise(AC.currentTime,3,120,500,.05);chime([60,67,72,76],.5,.05)},
unlock:()=>{noise(AC.currentTime,1.5,300,900,.03);chime([72,76,79,84,88],.2,.06)},pop:()=>tone(84,AC.currentTime,{v:.03,d:.4})};

addEventListener('pointerdown',aInit,{once:true});addEventListener('keydown',aInit,{once:true});
/* ---------- UI helpers ---------- */
let modalOpen=false,closable=true;
function modal(html,btns,cl=true){const m=$('#m');m.innerHTML='<div class=card>'+html+'<div class=bt></div></div>';btns.forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;m.querySelector('.bt').append(b)});m.hidden=false;modalOpen=true;closable=cl}
function closeM(){$('#m').hidden=true;modalOpen=false;$('#m').innerHTML=''}
let tt;function toast(t,ms=3000){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,ms)}
function fade(fn){const f=$('#fade');f.style.opacity=1;setTimeout(()=>{fn();f.style.opacity=0},650)}

const g=S.done.includes('garden');$('#obj').innerHTML=`<b>Garden</b> ${g?'Completed ✓':'In progress'}<br>Puzzle: ${S.puz?'Solved':'Not solved'}<br>Heart: ${S.heart?'Collected':S.puz?'Revealed':'Hidden'}<br>Star: ${S.star?'Collected':S.heart?'Revealed':'Hidden'}<br>Flower ${S.ex.flower?'✓':'○'} Fountain ${S.ex.pond?'✓':'○'} Sparkle stone ${S.ex.orn?'✓':'○'}`}
$('#bmap').onclick=()=>{modal('<h2>The Little Universe</h2><p>Worlds completed: '+S.done.length+'/4 · Locations remaining: '+(4-S.done.length)+'</p>'+LOCS.map(l=>{const s=st(l[0]);return `<div class=row data-l="${l[0]}"><span>${s=='Locked'?'🔒':s=='Completed'?'✓':'✿'} ${l[1]}</span><i>${s}</i></div>`}).join('<div style="opacity:.4">│</div>'),[['Close',closeM]]);
document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const s=st(r.dataset.l);toast(s=='Locked'?'This door is still closed. Finish the current adventure first ♡':s=='Current'?'You are here ♡':'Open this door from where it waits ♡')})};
$('#inv').onclick=()=>{modal('<h2>Your collection</h2>'+(S.heart?'<p>♡ The Heart of Welcome</p>':'')+(S.star?'<p>✦ Guardian of the Blooming Garden</p>':'')+(!S.heart&&!S.star?'<p>Nothing yet. Keep exploring!</p>':''),[...(S.heart?[['Read the heart message ♡',heartCard]]:[]),['Close',closeM]])};
$('#snd').onclick=()=>{S.mute=!S.mute;$('#snd').textContent=S.mute?'🔇':'♪';vol();save()};
$('#vol').oninput=e=>{S.vol=+e.target.value;if(S.mute&&S.vol>0){S.mute=0;$('#snd').textContent='♪'}vol();save()};
/* ---------- character ---------- */
function E(x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill()}
function girl(x,y,k,t,mv,dir,up){c.save();c.translate(x,y);c.scale(k*(dir<0?-1:1),k);const sw=mv?Math.sin(t*14)*4:0,bob=mv?Math.abs(Math.sin(t*14))*2:Math.sin(t*2);
E(0,2,14,5,'rgba(80,60,80,.2)');c.fillStyle='#f6d3c0';c.fillRect(-6+sw*.6,-12,4,12);c.fillRect(2-sw*.6,-12,4,12);E(-5+sw*.6,0,4,2,'#fff');E(5-sw*.6,0,4,2,'#fff');
c.fillStyle='#f6a9c0';c.beginPath();c.moveTo(-8,-26-bob);c.lineTo(8,-26-bob);c.lineTo(12,-10);c.lineTo(-12,-10);c.fill();E(0,-12,12,2.5,'#fff6ee');
E(-9,-22-bob,3,3,'#f6d3c0');E(9,-22-bob,3,3,'#f6d3c0');E(0,-37-bob,12.5,11,'#7a5a4f');
if(!up){E(0,-33-bob,10,9.5,'#f6d3c0');c.fillStyle='#7a5a4f';c.beginPath();c.ellipse(0,-40-bob,11,5.5,0,Math.PI,0);c.fill();
const bl=(t%4)<.15?.3:1.4;E(-4,-33-bob,1.4,bl,'#4a3040');E(4,-33-bob,1.4,bl,'#4a3040');E(-6.5,-30-bob,2,1.2,'rgba(244,150,170,.6)');E(6.5,-30-bob,2,1.2,'rgba(244,150,170,.6)')}
else E(0,-33-bob,11,10,'#7a5a4f');c.restore()}
function door(cx,by,w,h,open,wood,glow){c.save();c.beginPath();c.moveTo(cx-w/2,by);c.lineTo(cx-w/2,by-h+w/2);c.arc(cx,by-h+w/2,w/2,Math.PI,0);c.lineTo(cx+w/2,by);c.closePath();
c.shadowColor='#ffe8a8';c.shadowBlur=glow;c.fillStyle='#fff3c8';c.fill();c.shadowBlur=0;c.clip();
if(open>0){const g=c.createLinearGradient(0,by-h,0,by);g.addColorStop(0,'#cfe6ff');g.addColorStop(1,'#bde0b0');c.fillStyle=g;c.fillRect(cx-w/2,by-h,w,h)}

c.restore();c.strokeStyle='#e8c27a';c.lineWidth=4;c.beginPath();c.moveTo(cx-w/2,by);c.lineTo(cx-w/2,by-h+w/2);c.arc(cx,by-h+w/2,w/2,Math.PI,0);c.lineTo(cx+w/2,by);c.stroke()}
/* ---------- state ---------- */
let scene='title',t=0,tt0=0,opening=0,keys={},P={x:130,y:420,mv:0,dir:1,up:0,tx:null,ty:null,sc:0},sp=[],anim=null,near=null,flies=[0,1,2].map(i=>({i})),fs=0;
const rnd=(()=>{let s=7;return()=>(s=s*16807%2147483647)/2147483647})(),FL=Array.from({length:70},()=>({x:rnd()*W,y:100+rnd()*370,c:['#f6b6c9','#fff','#cdbcf0'][rnd()*3|0],r:3+rnd()*4,p:rnd()*6}));
const PT=Array.from({length:12},()=>({x:rnd()*W,y:rnd()*H,v:15+rnd()*15,p:rnd()*6})),SOL=[[470,290,170,100],[75,335,110,34],[50,100,30,24],[725,200,30,24],[600,70,30,24],[225,300,50,30]],
PATH=[[130,460],[200,420],[300,400],[380,330],[430,230],[420,150],[400,100]];
const OB=[{id:'flower',x:250,y:315,l:'Special flower',v:()=>1,a:puzzle},{id:'pond',x:555,y:345,l:'Fountain',v:()=>1,a:()=>{const f=!S.ex.pond;S.ex.pond=1;sfx('spark');burst(555,330,'#bfe0ff',8);toast('The water sings softly ♡');save();hud();if(f)check()}},
{id:'orn',x:700,y:405,l:'Sparkle stone',v:()=>1,a:()=>{const f=!S.ex.orn;S.ex.orn=1;sfx('spark');burst(700,395,'#ffe8a8',8);toast('The little stone twinkles, as if it knows a secret ✦');save();hud();if(f)check()}},
{id:'heart',x:695,y:145,l:'Glowing spot',v:()=>S.puz&&!S.heart,a:()=>{anim={k:'heart',t:0,x:695,y:145};sfx('heart')}},
{id:'star',x:115,y:165,l:'Glowing spot',v:()=>S.heart&&!S.star,a:()=>{anim={k:'star',t:0,x:115,y:165};sfx('star')}},
{id:'door',x:400,y:120,l:'Door',v:()=>1,a:()=>{S.done.includes('garden')?doorCard():toast('The door is sleeping. Complete the garden first ♡')}}];
function burst(x,y,col,n=10){for(let i=0;i<n;i++)sp.push({x,y,vx:R(-40,40),vy:R(-60,-10),l:1,col})}
function blocked(x,y){if(x<20||x>780||y<(scene==='home'?150:scene==='forest'?112:scene==='hill'?214:100)||y>465)return 1;return (scene==='hill'?SOLHL:scene==='forest'?SOLF:scene==='home'?SOLH:SOL).some(r=>x>r[0]-8&&x<r[0]+r[2]+8&&y>r[1]&&y<r[1]+r[3]+4)}
/* ---------- puzzle ---------- */
function puzzle(){S.ex.flower=1;save();hud();const C={2:'#f4a0bb',3:'#b9a2ee',4:'#ffd07a'},pl={};let sel=null;

function phv(m,w,h){
  modal(
    "<h2>"+(m.title||'A little memory')+"</h2>"+
    "<div id='pv' style='margin:0 auto;width:"+w+"px;height:"+h+
    "px;max-width:100%;border:6px solid #f3ead8;border-radius:6px;"+
    "box-shadow:0 2px 8px rgba(60,40,70,.3);overflow:hidden;"+
    "background:#dfe4d6;display:flex;align-items:center;"+
    "justify-content:center;color:#a9b49c;font-size:30px'>✦</div>"+
    "<p id='pc' style='font-size:14px;margin:.8em 0 0'></p>",
    [['Close',closeM]]
  );

  const cap=$('#pc');
  cap.textContent=m.cap||'';

  const photoSrc = m.src || '';

  if(photoSrc){
    const im=new Image();

    im.onload=()=>{
      const v=$('#pv');
      if(!v)return;

      v.textContent='';if(im.naturalHeight>im.naturalWidth*1.1){v.style.width='150px';v.style.height='min(266px,46vh)';}
      im.style.cssText=
        'display:block;width:100%;height:100%;'+
        'object-fit:cover;object-position:'+
        (m.pos||'50% 50%')+';';

      v.append(im);
    };

    im.onerror=()=>{
      const v=$('#pv');
      if(!v)return;

      v.style.fontSize='12px';
      v.style.padding='8px';
      v.style.boxSizing='border-box';
      v.textContent='Photo could not load. Check the image path or upload it using Photos ♡.';
    };

    im.src=photoSrc;
  }
}
